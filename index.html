<!DOCTYPE html>
<html lang="ko" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT PARK 의 올인원 블로깅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Dodum&family=Black+Han+Sans&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
      @font-face {
          font-family: 'GmarketSans';
          font-weight: 700;
          font-style: normal;
          src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
          font-display: swap;
      }
      @font-face {
          font-family: 'Cafe24Ssurround';
          font-weight: normal; /* This font is naturally bold */
          font-style: normal;
          src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2205@1.0/Cafe24Ssurround.woff2') format('woff2');
          font-display: swap;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #1e293b;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-pulse, .animate-spin { animation: none !important; }
        * { transition-duration: 0.01ms !important; }
      }
      html { color-scheme: dark; }
      body { font-family: 'Pretendard', 'Inter', 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(59, 130, 246, 0.45); color: #fff; }
      button:focus-visible, a:focus-visible, [role="tab"]:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 2px;
      }
      button:not(:disabled), select { cursor: pointer; }
      input[type="checkbox"] { accent-color: #2563eb; }
      * { scrollbar-color: #475569 #1e293b; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              korean: ['Noto Sans KR', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.11.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/"
  }
}
    </script>
</head>
  <body class="bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
